<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci ! | Mejdi Sidaoui</title>
    <!-- On utilise la même police que l'index -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;    
            --accent: #2563eb;     
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--primary);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 60px;
            color: var(--accent);
            margin-bottom: 20px;
        }
        h1 { 
            margin-bottom: 15px; 
            font-size: 2rem;
            font-weight: 700;
        }
        p { 
            color: var(--text-muted); 
            margin-bottom: 35px; 
            line-height: 1.6;
            font-size: 1.1rem;
        }
        .btn {
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn:hover { 
            background: #1d4ed8; 
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Message Envoyé !</h1>
        <p>Merci pour votre intérêt. J'ai bien reçu vos informations et je vous répondrai dans les plus brefs délais.</p>
        <a href="index.html" class="btn">Retour au portfolio</a>
    </div>
</body>
</html>
